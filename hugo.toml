baseURL = '/'
languageCode = 'en'
title = 'mondocs'
theme = 'monbooru'
enableGitInfo = true

relativeURLs = true
uglyURLs = true

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

[markup.goldmark.renderHooks.image]
enableDefault = true

[markup.goldmark.renderHooks.link]
enableDefault = true

[markup.highlight]
noClasses = false

[params]
  root = '/'

[[cascade]]
  [cascade._build]
    publishResources = false
