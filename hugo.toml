baseURL = '/'
languageCode = 'en'
title = 'mondocs'
theme = 'monbooru'
enableGitInfo = true

relativeURLs = true
uglyURLs = true

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

[outputFormats.SearchIndex]
mediaType = 'text/javascript'
baseName = 'search-index'
isPlainText = true
notAlternative = true

[outputs]
home = ['html', 'SearchIndex']

[markup.goldmark.renderHooks.image]
enableDefault = true

[markup.goldmark.renderHooks.link]
enableDefault = true

[markup.highlight]
noClasses = false

[params]
  root = '/'
  github = 'https://github.com/monbooru/monbooru'
  demo = 'https://monbooru.github.io/demo/'

[[cascade]]
  [cascade._build]
    publishResources = false
